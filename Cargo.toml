[workspace]
resolver = "2"
members = [
    "crates/beacon",
    "crates/core",
    "crates/crypto",
    "crates/crypto-bls",
    "crates/crypto-mock",
    "crates/demo",
    "crates/dispatch",
    "crates/dispatch-pooled",
    "crates/dispatch-sync",
    "crates/effects-bridge",
    "crates/engine",
    "crates/execution",
    "crates/jmt",
    "crates/mempool",
    "crates/metrics",
    "crates/metrics-memory",
    "crates/metrics-prometheus",
    "crates/network",
    "crates/network-libp2p",
    "crates/network-memory",
    "crates/node",
    "crates/production",
    "crates/provisions",
    "crates/remote-headers",
    "crates/scenarios",
    "crates/shard",
    "crates/simulation",
    "crates/simulator",
    "crates/spammer",
    "crates/storage",
    "crates/storage-memory",
    "crates/storage-rocksdb",
    "crates/transactions",
    "crates/types",
]
exclude = ["vm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
hyperscale-beacon = { path = "crates/beacon" }
hyperscale-core = { path = "crates/core" }
hyperscale-crypto = { path = "crates/crypto" }
hyperscale-crypto-bls = { path = "crates/crypto-bls" }
hyperscale-crypto-mock = { path = "crates/crypto-mock" }
hyperscale-dispatch = { path = "crates/dispatch" }
hyperscale-dispatch-pooled = { path = "crates/dispatch-pooled" }
hyperscale-dispatch-sync = { path = "crates/dispatch-sync" }
hyperscale-effects-bridge = { path = "crates/effects-bridge" }
hyperscale-engine = { path = "crates/engine" }
hyperscale-execution = { path = "crates/execution" }
hyperscale-jmt = { path = "crates/jmt", features = ["parallel"] }
hyperscale-mempool = { path = "crates/mempool" }
hyperscale-metrics = { path = "crates/metrics" }
hyperscale-metrics-memory = { path = "crates/metrics-memory" }
hyperscale-metrics-prometheus = { path = "crates/metrics-prometheus" }
hyperscale-network = { path = "crates/network" }
hyperscale-network-libp2p = { path = "crates/network-libp2p" }
hyperscale-network-memory = { path = "crates/network-memory" }
hyperscale-node = { path = "crates/node" }
hyperscale-provisions = { path = "crates/provisions" }
hyperscale-remote-headers = { path = "crates/remote-headers" }
hyperscale-scenarios = { path = "crates/scenarios" }
hyperscale-shard = { path = "crates/shard" }
hyperscale-simulation = { path = "crates/simulation" }
hyperscale-spammer = { path = "crates/spammer" }
hyperscale-storage = { path = "crates/storage" }
hyperscale-storage-memory = { path = "crates/storage-memory" }
hyperscale-storage-rocksdb = { path = "crates/storage-rocksdb" }
hyperscale-transactions = { path = "crates/transactions" }
hyperscale-types = { path = "crates/types" }

# External dependencies
arc-swap = "1.9.2"
blake3 = "1.8.6"
blst = "0.3.17"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
core_affinity = "0.8.3"
crossbeam = "0.8.4"
dashmap = "6.2.1"
ed25519-dalek = "3.0.0"
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
futures = "0.3.33"
hdrhistogram = "7.6.0"
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
im = "15.1.0"
indexmap = "2.14.0"
libp2p = { version = "0.56.0", features = ["gossipsub", "kad", "quic", "tokio", "macros", "identify"] }
ml-dsa = "0.1.1"
libp2p-stream = "0.4.0-alpha"
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "reqwest-rustls"] }
opentelemetry-semantic-conventions = "0.32.1"
papaya = "0.2.4"
parking_lot = "0.12.5"
proptest = "1.11.0"
quick_cache = "0.7.0"
rand = "0.10.2"
rand_chacha = "0.10.0"
rayon = "1.12.0"
rocksdb = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = "0.3.23"
tracing-test = "0.2.6"
wasm-bindgen = "0.2.127"
wasmtime = { version = "=48.0.0", features = ["component-model", "winch", "pulley"] }
# Exact: `wat` versions as 1.x, so a caret would admit the whole major and
# drag a second wasm-encoder and wasmparser in behind the engine's own.
wat = "=1.254.0"
zeroize = "1.9.0"

# VM dependencies (the `vm/` submodule of github.com/hyperscalers/hyperscale-vm).
# `vm-effects` (types and the routing vocabulary) feeds admission through the
# effects bridge; the kernel, runtimes, and stdlib blob are consumed only by
# `crates/engine`. The pinned rev is the submodule pointer; bumps are
# deliberate pointer commits, never `cargo update` drift. The wasmtime pin
# mirrors the VM repo's blessed engine exactly, and the wasm-tools versions
# mirror the line that engine parses with; upgrades are protocol events.
hyperscale-hbor = { path = "vm/crates/hbor" }
hyperscale-vm-effects = { path = "vm/crates/effects" }
hyperscale-vm-fixtures = { path = "vm/crates/fixtures" }
hyperscale-vm-gate = { path = "vm/crates/gate" }
hyperscale-vm-kernel = { path = "vm/crates/kernel" }
hyperscale-vm-manifest-builder = { path = "vm/crates/manifest-builder" }
hyperscale-vm-meter = { path = "vm/crates/meter" }
hyperscale-vm-ref = { path = "vm/crates/ref" }
hyperscale-vm-runtime = { path = "vm/crates/runtime", default-features = false }
hyperscale-vm-sdk = { path = "vm/crates/sdk" }
hyperscale-vm-stdlib = { path = "vm/crates/stdlib" }
hyperscale-vm-types = { path = "vm/crates/types" }

[workspace.lints.rust]
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
absolute_paths = { level = "warn", priority = -1 }
assert_is_empty = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
private_intra_doc_links = "allow"
redundant_explicit_links = "warn"

# Browser profile: the demo ships over the wire, so size beats compile time.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# CI test profile: release-grade optimization so the simulation suite runs at
# full speed, with debug assertions and overflow checks kept on.
[profile.ci]
inherits = "release"
debug-assertions = true
overflow-checks = true
