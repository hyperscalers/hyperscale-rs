# Nextest profile used by CI (selected with `--profile ci`).
[profile.ci]
# Report every failure in a run rather than stopping at the first.
fail-fast = false
# Outside the sim harnesses the suite is sub-second unit and integration
# tests; flag anything past 2 minutes and kill at 10 — that's a wedge, not
# a test.
slow-timeout = { period = "120s", terminate-after = 5 }

# The ci feature runs sims at the production 5-minute epoch
# (hyperscale-simulator inherits it through its simulation dependency), so the
# largest reshape sims run far longer than the rest of the suite and need their
# own slow-timeout. A sim holds multi-node state in memory but peaks near 1 GiB
# per process, so a 4-vCPU/16 GiB runner seats one per thread without pressure.
[[profile.ci.overrides]]
filter = "package(hyperscale-simulation) or package(hyperscale-production) or package(hyperscale-simulator)"
slow-timeout = { period = "300s", terminate-after = 48 }
