[package]
name = "hyperscale-spammer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transaction spammer for Hyperscale network"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hyperscale-spammer"
path = "src/bin/spammer.rs"

[dependencies]
# Workspace dependencies
hyperscale-effects-bridge.workspace = true
hyperscale-transactions.workspace = true
hyperscale-types.workspace = true

hyperscale-hbor.workspace = true

# Async runtime
tokio.workspace = true
tokio-util = { version = "0.7.19", features = ["rt"] }

# HTTP client
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

# Serialization
serde.workspace = true
serde_json.workspace = true
hex.workspace = true

# CLI
clap.workspace = true
humantime = "2.4.0"

# Utils
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
rand_chacha.workspace = true
hdrhistogram.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
futures.workspace = true

[dev-dependencies]
tokio-test = "0.4.5"

[lints]
workspace = true
