[package]
name = "hyperscale-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine integration: the tick-batch execution seam, the executor behind it, and genesis seeding"

[dependencies]
hyperscale-effects-bridge.workspace = true
hyperscale-metrics.workspace = true
hyperscale-storage.workspace = true
hyperscale-types.workspace = true
hyperscale-vm-effects.workspace = true
hyperscale-vm-types.workspace = true
thiserror.workspace = true
hyperscale-vm-kernel.workspace = true
hyperscale-vm-stdlib.workspace = true

arc-swap.workspace = true
blake3.workspace = true
indexmap.workspace = true
tracing.workspace = true

hyperscale-hbor.workspace = true

# The blessed engine runs native; the reference interpreter is the
# wasm32 implementation by decision (the in-browser simulation), not a
# fallback. The differential guarantee — byte-identical receipts and
# fuel across both runtimes — is what makes the split sound.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hyperscale-vm-meter.workspace = true
hyperscale-vm-runtime = { workspace = true, features = ["engine"] }
crossbeam.workspace = true
wasmtime.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
hyperscale-vm-ref.workspace = true
# Admission alone: an artifact has to be judged and instrumented where
# the blessed engine is not built in.
hyperscale-vm-runtime.workspace = true

# The reference interpreter only ships on wasm32, so nothing in a native
# run would notice it rejecting the artifact's metadata section — and the
# first thing to notice would be the browser build.
[dev-dependencies]
hyperscale-storage = { workspace = true, features = ["test-utils"] }
hyperscale-storage-memory.workspace = true
hyperscale-vm-fixtures.workspace = true
hyperscale-transactions.workspace = true
hyperscale-types = { workspace = true, features = ["test-utils"] }
hyperscale-vm-manifest-builder.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
hyperscale-vm-ref.workspace = true

[lints]
workspace = true
