[package]
name = "hyperscale-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser session over the deterministic simulation"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hyperscale-effects-bridge.workspace = true
hyperscale-transactions.workspace = true
hyperscale-node.workspace = true
hyperscale-simulation.workspace = true
hyperscale-storage.workspace = true
hyperscale-types.workspace = true
hyperscale-vm-effects.workspace = true

serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

# Unused in code: these exist to select a wasm backend for RNG crates pulled
# in transitively, which have no default on this target. Three getrandom
# majors are in the graph and each needs its own.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

[lints]
workspace = true
