[package]
name = "hyperscale-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core types for Hyperscale consensus"

[dependencies]
# Cryptographic primitives
blake3.workspace = true
hex.workspace = true
rand.workspace = true

# Consensus crypto interface (role newtypes, Signer/Verifier)
hyperscale-crypto.workspace = true
# BLS impl for the test-utils fixtures (deterministic committees)
hyperscale-crypto-bls = { workspace = true, optional = true }

# Merkle proof verification (Verify<ProvisionsContext>)
hyperscale-jmt.workspace = true

# Serialization
hyperscale-hbor.workspace = true
hyperscale-vm-types.workspace = true

# Error handling
thiserror.workspace = true

# Diagnostics
tracing.workspace = true

# Transaction signing
ed25519-dalek.workspace = true
k256.workspace = true
ml-dsa.workspace = true
zeroize.workspace = true

[features]
test-utils = ["dep:hyperscale-crypto-bls"]

[dev-dependencies]
hyperscale-crypto-bls = { workspace = true, features = ["test-utils"] }
proptest.workspace = true
syn = { version = "2.0.119", features = ["full", "parsing", "visit"] }

[lints]
workspace = true
