[package]
name = "hyperscale-network-iroh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "iroh network transport: direct QUIC paths between validators behind NAT"

[features]
default = []
# Loopback fixtures: an in-process relay and a userspace UDP bridge that can
# be cut. Never enabled by the production binary.
test-utils = ["dep:iroh-relay", "dep:tokio"]

[dependencies]
iroh.workspace = true

# Optional dependencies
iroh-relay = { workspace = true, features = ["server"], optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
clap.workspace = true
futures.workspace = true
hyperscale-network-iroh = { workspace = true, features = ["test-utils"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[[example]]
name = "probe"
required-features = ["test-utils"]

[lints]
workspace = true
