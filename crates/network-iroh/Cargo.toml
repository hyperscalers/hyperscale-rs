[package]
name = "hyperscale-network-iroh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "iroh network transport: direct QUIC paths between validators behind NAT"

[features]
default = []
# Seeded fixtures, plus loopback fixtures: an in-process relay and DNS
# server, and a userspace UDP bridge that can be cut. Never enabled by the
# production binary.
test-utils = [
    "hyperscale-network/test-utils",
    "dep:hyperscale-crypto-bls",
    "dep:iroh-relay",
    "dep:simple-dns",
]

[dependencies]
hyperscale-crypto.workspace = true
arc-swap.workspace = true
blake3.workspace = true
bytes.workspace = true
clap.workspace = true
dashmap.workspace = true
futures.workspace = true
hex.workspace = true
hyperscale-metrics.workspace = true
hyperscale-network.workspace = true
hyperscale-types.workspace = true
iroh.workspace = true
libc = "0.2.191"
parking_lot.workspace = true
rand.workspace = true
hyperscale-hbor.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true

# Optional dependencies
# Test fixtures mint real BLS keys; the transport itself speaks `dyn Verifier`.
hyperscale-crypto-bls = { workspace = true, optional = true }
iroh-relay = { workspace = true, features = ["server"], optional = true }
simple-dns = { version = "0.12.0", optional = true }

[dev-dependencies]
arc-swap.workspace = true
rand_chacha.workspace = true
rustls-pki-types = { version = "1.15.1", features = ["std"] }
hyperscale-crypto-bls.workspace = true
hyperscale-network-iroh = { workspace = true, features = ["test-utils"] }
hyperscale-node.workspace = true
hyperscale-types = { workspace = true, features = ["test-utils"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[[example]]
name = "probe"
required-features = ["test-utils"]

[[example]]
name = "bench"
required-features = ["test-utils"]

[[example]]
name = "seat"
required-features = ["test-utils"]

[lints]
workspace = true
