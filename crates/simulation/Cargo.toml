[package]
name = "hyperscale-simulation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Simulation runner"

[features]
# Sign with real BLS12-381 instead of the constant-cost mock scheme.
bls = []
# Run the sims on the 5-minute production beacon epoch instead of the fast 30s
# local one.
production-epochs = []

[dependencies]
hyperscale-crypto-bls.workspace = true
hyperscale-crypto-mock.workspace = true
arc-swap.workspace = true
crossbeam.workspace = true
hyperscale-beacon.workspace = true
hyperscale-core.workspace = true
hyperscale-shard.workspace = true
hyperscale-engine.workspace = true
hyperscale-execution.workspace = true
hyperscale-hbor.workspace = true
hyperscale-mempool.workspace = true
hyperscale-network.workspace = true
hyperscale-network-memory.workspace = true
hyperscale-node.workspace = true
hyperscale-provisions.workspace = true
hyperscale-storage.workspace = true
hyperscale-storage-memory.workspace = true
hyperscale-types.workspace = true
hyperscale-dispatch-sync.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tracing.workspace = true

[dev-dependencies]
hyperscale-effects-bridge.workspace = true
hyperscale-types = { workspace = true, features = ["test-utils"] }
hyperscale-metrics.workspace = true
hyperscale-metrics-memory.workspace = true
hyperscale-scenarios.workspace = true
tracing-test.workspace = true

[lints]
workspace = true
