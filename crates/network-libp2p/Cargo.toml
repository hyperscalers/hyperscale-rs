[package]
name = "hyperscale-network-libp2p"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Production libp2p network transport"

[features]
default = []
test-utils = [
    "hyperscale-network/test-utils",
    "dep:hyperscale-crypto-bls",
]

[dependencies]
hyperscale-crypto.workspace = true
arc-swap.workspace = true
bytes.workspace = true
clap.workspace = true
dashmap.workspace = true
futures.workspace = true
hyperscale-metrics.workspace = true
libp2p.workspace = true
libp2p-stream.workspace = true
hyperscale-network.workspace = true
hyperscale-types.workspace = true
rand.workspace = true
hyperscale-hbor.workspace = true
parking_lot.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# Optional dependencies
# Test fixtures mint real BLS keys; the seam itself speaks `dyn Verifier`.
hyperscale-crypto-bls = { workspace = true, optional = true }

[dev-dependencies]
hyperscale-crypto-bls.workspace = true
hyperscale-network-libp2p = { workspace = true, features = ["test-utils"] }
hyperscale-types = { workspace = true, features = ["test-utils"] }
serial_test = "3.5.0"
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[lints]
workspace = true
